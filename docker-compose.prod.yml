services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synergy} -d ${POSTGRES_DB:-synergyflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: golang:1.22-alpine
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./backend/migrations:/migrations"]
    command: >
      sh -c "go install github.com/pressly/goose/v3/cmd/goose@v3.27.1 && goose -dir /migrations postgres '${DATABASE_URL}' up"
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["8080"]
  worker:
    build: ./backend
    command: ["/app/worker"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  frontend:
    build: ./frontend
    expose: ["80"]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [frontend, backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes: { pgdata: {}, redisdata: {} }
