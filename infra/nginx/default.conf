# ─────────────────────────────────────────────────
# SynergyFlow — Nginx production configuration
# ─────────────────────────────────────────────────
# Route: /api/* → Go backend, / → React frontend.
# SSE endpoints under /api/projects/*/events use
# unbuffered streaming with long read timeout.
# ─────────────────────────────────────────────────

upstream backend { server backend:8080; }
upstream frontend { server frontend:80; }

# HTTP → HTTPS redirect — uncomment after TLS setup
# server {
#   listen 80;
#   server_name synergyflow.example.com;
#   return 301 https://$host$request_uri;
# }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 12m;

  # ── Real-time SSE (Server-Sent Events) ──
  # Must come before the general /api/ block (nginx uses longest prefix match).
  location ~ ^/api/projects/[a-f0-9-]+/events$ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering          off;
    proxy_cache              off;
    proxy_read_timeout       1h;
    proxy_send_timeout       1h;
  }

  # ── General API proxy ──
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 90s;

    # CORS preflight
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
  }

  # ── Health check endpoints (unauthenticated) ──
  location /health {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /ready {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ── Frontend SPA ──
  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Let the SPA nginx handle its own 404 → /index.html fallback
    proxy_intercept_errors off;
  }
}
